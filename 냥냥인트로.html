<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냥냥AI 서버 인트로</title>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard-dynamic-subset.css" />
    <style>
        @font-face {
            font-family: 'SummerFlowerTree';
            src: url('Asummerflowertree.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --intro-bg: #071916;
            --mint: #7fffd9;
            --mint-strong: #39e8c5;
            --sky: #8fd7ff;
            --cream: #fff6df;
            --ink: #3a2a20;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            display: grid;
            place-items: center;
            background: #0c1513;
            font-family: 'SummerFlowerTree', 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            color: var(--cream);
        }

        #presentation {
            position: relative;
            width: min(100vw, calc(100vh * 16 / 9));
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 82%, rgba(127, 255, 217, 0.22), transparent 26%),
                radial-gradient(circle at 50% 46%, rgba(143, 215, 255, 0.16), transparent 32%),
                radial-gradient(circle at 18% 16%, rgba(255, 246, 223, 0.10), transparent 26%),
                linear-gradient(135deg, #081715 0%, #11231f 48%, #07110f 100%);
            box-shadow: 0 24px 90px rgba(0, 0, 0, 0.42);
            isolation: isolate;
        }

        /* ===== 냥냥AI 서버 인트로 시작 ===== */
        .nyang-ai-intro {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            padding: clamp(36px, 5vw, 92px);
        }

        .nyang-ai-intro::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(127, 255, 217, 0.055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(127, 255, 217, 0.055) 1px, transparent 1px);
            background-size: clamp(42px, 4.5vw, 72px) clamp(42px, 4.5vw, 72px);
            mask-image: radial-gradient(circle at center, black 0 52%, transparent 86%);
            pointer-events: none;
        }

        .nyang-ai-intro::after {
            content: "";
            position: absolute;
            inset: 0;
            opacity: 0;
            background:
                radial-gradient(circle at 50% 45%, transparent 0 22%, rgba(0, 0, 0, 0.34) 64%),
                rgba(0, 0, 0, 0.16);
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .nyang-ai-intro[data-state="playing"]::after,
        .nyang-ai-intro[data-state="completed"]::after {
            opacity: 1;
        }

        .intro-orbit {
            position: absolute;
            width: min(78vw, 1160px);
            aspect-ratio: 1;
            border-radius: 50%;
            border: 2px solid rgba(127, 255, 217, 0.22);
            box-shadow:
                inset 0 0 54px rgba(127, 255, 217, 0.08),
                0 0 72px rgba(57, 232, 197, 0.12);
            transform: translateY(7%);
            opacity: 0.75;
        }

        .intro-orbit::before,
        .intro-orbit::after {
            content: "";
            position: absolute;
            inset: 9%;
            border-radius: 50%;
            border: 1px dashed rgba(143, 215, 255, 0.20);
        }

        .intro-orbit::after {
            inset: 19%;
            border-style: solid;
            border-color: rgba(255, 246, 223, 0.14);
        }

        .intro-stage {
            position: relative;
            z-index: 2;
            width: min(88vw, 1340px);
            height: min(76vh, 820px);
            display: grid;
            place-items: center;
        }

        .character-layer {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            pointer-events: none;
        }

        .character-full {
            width: min(38vw, 520px);
            max-height: min(72vh, 760px);
            object-fit: contain;
            filter:
                drop-shadow(0 34px 44px rgba(0, 0, 0, 0.46))
                drop-shadow(0 0 28px rgba(127, 255, 217, 0.16));
            transform: translateY(7%) scale(1);
            transform-origin: 50% 30%;
            opacity: 1;
        }

        .face-open,
        .face-wink {
            position: absolute;
            width: min(58vw, 760px);
            max-height: min(74vh, 760px);
            object-fit: contain;
            opacity: 0;
            transform: translateY(2%) scale(0.86);
            filter:
                drop-shadow(0 34px 54px rgba(0, 0, 0, 0.50))
                drop-shadow(0 0 34px rgba(127, 255, 217, 0.22));
        }

        .intro-copy {
            position: absolute;
            z-index: 5;
            left: max(48px, 6vw);
            right: max(48px, 6vw);
            bottom: clamp(44px, 6vh, 82px);
            display: grid;
            justify-items: center;
            gap: 14px;
            text-align: center;
        }

        .intro-kicker {
            margin: 0;
            color: rgba(127, 255, 217, 0.90);
            font-family: 'Outfit', 'Pretendard', sans-serif;
            font-size: clamp(16px, 1.45vw, 26px);
            font-weight: 800;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            text-shadow: 0 0 18px rgba(57, 232, 197, 0.36);
        }

        .intro-title {
            margin: 0;
            color: #fff8e6;
            font-size: clamp(44px, 6vw, 96px);
            font-weight: 950;
            line-height: 1.02;
            letter-spacing: 0;
            text-shadow: 0 10px 26px rgba(0, 0, 0, 0.44);
        }

        .intro-hint,
        .intro-continue {
            margin: 0;
            min-width: min(760px, 82vw);
            padding: 16px 28px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.10);
            box-shadow:
                16px 16px 34px rgba(0, 0, 0, 0.20),
                -12px -12px 28px rgba(255, 255, 255, 0.05),
                inset 0 0 0 1px rgba(255, 255, 255, 0.08);
            color: #fef9e9;
            font-size: clamp(19px, 2vw, 34px);
            font-weight: 900;
            line-height: 1.25;
            backdrop-filter: blur(12px);
        }

        .intro-continue,
        .intro-online {
            opacity: 0;
            transform: translateY(18px) scale(0.96);
        }

        .intro-online {
            position: absolute;
            z-index: 7;
            top: clamp(58px, 8vh, 112px);
            left: 50%;
            translate: -50% 0;
            min-width: min(760px, 82vw);
            padding: 18px 32px;
            border-radius: 28px;
            text-align: center;
            color: #061916;
            background: linear-gradient(135deg, #fff8dc 0%, #9fffe3 48%, #8fd7ff 100%);
            box-shadow:
                0 0 34px rgba(127, 255, 217, 0.62),
                0 22px 54px rgba(0, 0, 0, 0.30),
                inset 0 0 0 2px rgba(255, 255, 255, 0.50);
            font-size: clamp(26px, 3.4vw, 58px);
            font-weight: 950;
            line-height: 1.08;
        }

        .ai-overlay {
            position: absolute;
            z-index: 6;
            left: 50%;
            top: 44%;
            width: min(55vw, 720px);
            aspect-ratio: 1;
            translate: -50% -50%;
            opacity: 0;
            pointer-events: none;
            filter: drop-shadow(0 0 18px rgba(127, 255, 217, 0.50));
        }

        .ai-ring {
            transform-origin: 250px 250px;
            animation: orbitSpin 9s linear infinite;
        }

        .ai-node {
            animation: nodePulse 1.5s ease-in-out infinite alternate;
        }

        .paw {
            animation: pawFloat 2.2s ease-in-out infinite alternate;
        }

        .fallback {
            position: absolute;
            inset: auto auto 16px 16px;
            z-index: 9;
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(255, 246, 223, 0.92);
            color: #35241a;
            font: 800 15px/1.3 'Pretendard', sans-serif;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .fallback.show {
            opacity: 1;
            transform: translateY(0);
        }

        .nyang-ai-intro[data-state="idle"] .intro-continue {
            display: none;
        }

        .nyang-ai-intro[data-state="playing"] .intro-copy {
            animation: copyFade 0.45s ease forwards;
        }

        .nyang-ai-intro[data-state="playing"] .character-full {
            animation: fullbodyZoom 3.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .nyang-ai-intro[data-state="playing"] .face-open {
            animation: faceOpenReveal 3.5s ease forwards;
        }

        .nyang-ai-intro[data-state="playing"] .face-wink {
            animation: faceWinkOnce 3.5s steps(1, end) forwards;
        }

        .nyang-ai-intro[data-state="playing"] .ai-overlay {
            animation: overlayReveal 3.5s ease forwards;
        }

        .nyang-ai-intro[data-state="playing"] .intro-online {
            animation: onlineReveal 3.5s ease forwards;
        }

        .nyang-ai-intro[data-state="completed"] .character-full {
            opacity: 0;
            transform: translateY(-10%) scale(2.65);
        }

        .nyang-ai-intro[data-state="completed"] .face-open {
            opacity: 1;
            transform: translateY(1%) scale(1);
        }

        .nyang-ai-intro[data-state="completed"] .face-wink {
            opacity: 0;
        }

        .nyang-ai-intro[data-state="completed"] .ai-overlay {
            opacity: 1;
            animation: overlayIdle 2.4s ease-in-out infinite alternate;
        }

        .nyang-ai-intro[data-state="completed"] .intro-hint {
            display: none;
        }

        .nyang-ai-intro[data-state="completed"] .intro-kicker,
        .nyang-ai-intro[data-state="completed"] .intro-title {
            display: none;
        }

        .nyang-ai-intro[data-state="completed"] .intro-continue {
            opacity: 1;
            transform: translateY(0) scale(1);
            animation: continuePulse 1.6s ease-in-out infinite alternate;
        }

        .nyang-ai-intro[data-state="completed"] .intro-online {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        @keyframes copyFade {
            to {
                opacity: 0;
                transform: translateY(24px);
            }
        }

        @keyframes fullbodyZoom {
            0%, 11% {
                opacity: 1;
                transform: translateY(7%) scale(1);
            }

            49% {
                opacity: 1;
                transform: translateY(-14%) scale(2.55);
            }

            58%, 100% {
                opacity: 0;
                transform: translateY(-17%) scale(2.75);
            }
        }

        @keyframes faceOpenReveal {
            0%, 34% {
                opacity: 0;
                transform: translateY(3%) scale(0.86);
            }

            48%, 100% {
                opacity: 1;
                transform: translateY(1%) scale(1);
            }
        }

        @keyframes faceWinkOnce {
            0%, 48% {
                opacity: 0;
            }

            49%, 60% {
                opacity: 1;
            }

            61%, 100% {
                opacity: 0;
            }
        }

        @keyframes overlayReveal {
            0%, 59% {
                opacity: 0;
                transform: scale(0.84) rotate(-8deg);
            }

            72%, 100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        @keyframes onlineReveal {
            0%, 91% {
                opacity: 0;
                transform: translateY(18px) scale(0.96);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes orbitSpin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes nodePulse {
            to {
                opacity: 0.42;
                transform: scale(0.88);
            }
        }

        @keyframes pawFloat {
            to {
                transform: translateY(-12px) rotate(7deg);
                opacity: 0.58;
            }
        }

        @keyframes overlayIdle {
            to {
                transform: scale(1.025);
                filter: drop-shadow(0 0 28px rgba(127, 255, 217, 0.72));
            }
        }

        @keyframes continuePulse {
            to {
                box-shadow:
                    0 0 24px rgba(127, 255, 217, 0.30),
                    16px 16px 34px rgba(0, 0, 0, 0.20),
                    -12px -12px 28px rgba(255, 255, 255, 0.05);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
        /* ===== 냥냥AI 서버 인트로 끝 ===== */
    </style>
</head>

<body>
    <main id="presentation" aria-label="냥냥AI 서버 인트로">
        <!-- ===== 냥냥AI 서버 인트로 시작: codex.html 삽입용 ===== -->
        <section class="nyang-ai-intro" id="nyang-ai-intro" data-state="idle" aria-live="polite">
            <div class="intro-orbit" aria-hidden="true"></div>

            <div class="intro-stage">
                <div class="character-layer">
                    <img class="character-full"
                        src="유니티images/AiServerIntro/nyang_ai_intro_fullbody.png"
                        alt="냥냥AI 서버 캐릭터 전신">
                    <img class="face-open"
                        src="유니티images/AiServerIntro/nyang_ai_intro_face_open.png"
                        alt="냥냥AI 서버 캐릭터 얼굴">
                    <img class="face-wink"
                        src="유니티images/AiServerIntro/nyang_ai_intro_face_wink.png"
                        alt="냥냥AI 서버 캐릭터 윙크">
                </div>

                <svg class="ai-overlay" viewBox="0 0 500 500" aria-hidden="true">
                    <defs>
                        <radialGradient id="mintGlow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
                            <stop offset="48%" stop-color="#7fffd9" stop-opacity="0.72" />
                            <stop offset="100%" stop-color="#39e8c5" stop-opacity="0" />
                        </radialGradient>
                    </defs>

                    <circle cx="250" cy="212" r="154" fill="none" stroke="#7fffd9" stroke-width="4"
                        stroke-opacity="0.52" />
                    <g class="ai-ring">
                        <circle cx="250" cy="212" r="188" fill="none" stroke="#8fd7ff" stroke-width="3"
                            stroke-dasharray="18 24" stroke-linecap="round" stroke-opacity="0.70" />
                        <circle cx="250" cy="24" r="9" fill="#fff8dc" />
                        <circle cx="438" cy="212" r="7" fill="#7fffd9" />
                        <circle cx="70" cy="212" r="7" fill="#8fd7ff" />
                    </g>

                    <g stroke="#d9fff5" stroke-width="4" stroke-linecap="round" stroke-opacity="0.78">
                        <path d="M174 190 C204 144, 286 144, 320 190" fill="none" />
                        <path d="M170 214 C206 250, 292 250, 328 214" fill="none" />
                        <path d="M210 160 L210 260" />
                        <path d="M252 150 L252 272" />
                        <path d="M294 160 L294 260" />
                    </g>

                    <g class="ai-node" fill="url(#mintGlow)">
                        <circle cx="210" cy="160" r="24" />
                        <circle cx="252" cy="150" r="22" />
                        <circle cx="294" cy="160" r="24" />
                        <circle cx="170" cy="214" r="20" />
                        <circle cx="328" cy="214" r="20" />
                        <circle cx="252" cy="272" r="23" />
                    </g>

                    <g transform="translate(170 68)">
                        <rect x="0" y="0" width="160" height="78" rx="24" fill="rgba(255,255,255,0.14)"
                            stroke="#7fffd9" stroke-width="3" />
                        <path d="M42 47 h76 M56 31 h48 M68 15 v16 M92 15 v16 M68 47 v16 M92 47 v16"
                            stroke="#fff8dc" stroke-width="5" stroke-linecap="round" />
                    </g>

                    <g class="paw" fill="#fff8dc" opacity="0.86">
                        <circle cx="116" cy="336" r="9" />
                        <circle cx="96" cy="352" r="7" />
                        <circle cx="118" cy="358" r="7" />
                        <circle cx="139" cy="352" r="7" />
                        <path d="M102 379 C104 359, 134 359, 136 379 C132 394, 106 394, 102 379Z" />
                    </g>

                    <g class="paw" fill="#8fd7ff" opacity="0.74" style="animation-delay: .35s">
                        <circle cx="386" cy="316" r="8" />
                        <circle cx="368" cy="330" r="6" />
                        <circle cx="388" cy="336" r="6" />
                        <circle cx="407" cy="330" r="6" />
                        <path d="M373 356 C376 340, 400 340, 403 356 C399 370, 377 370, 373 356Z" />
                    </g>
                </svg>
            </div>

            <div class="intro-copy">
                <p class="intro-kicker">Nyang AI Server Boot Sequence</p>
                <h1 class="intro-title">냥냥AI 서버</h1>
                <p class="intro-hint">Space 키를 눌러 냥냥AI 서버를 활성화</p>
                <p class="intro-continue">Space 키를 눌러 계속</p>
            </div>

            <div class="intro-online">냥냥AI 서버 ON</div>
            <div class="fallback" id="intro-fallback">이미지를 불러오지 못했습니다. AiServerIntro 폴더를 확인해 주세요.</div>
        </section>
        <!-- ===== 냥냥AI 서버 인트로 끝: codex.html 삽입용 ===== -->
    </main>

    <script>
        (() => {
            const intro = document.getElementById('nyang-ai-intro');
            const fallback = document.getElementById('intro-fallback');
            const imageEls = Array.from(intro.querySelectorAll('img'));
            const continueTarget = 'codex.html';
            let state = 'idle';
            let completeTimer = null;

            function canHandleSpace(event) {
                const target = event.target;
                if (!target) return true;
                const tagName = target.tagName;
                return !target.isContentEditable
                    && tagName !== 'INPUT'
                    && tagName !== 'TEXTAREA'
                    && tagName !== 'BUTTON'
                    && tagName !== 'SELECT';
            }

            function setState(nextState) {
                state = nextState;
                intro.dataset.state = nextState;
            }

            function completeIntro() {
                if (completeTimer) {
                    clearTimeout(completeTimer);
                    completeTimer = null;
                }
                setState('completed');
            }

            function playIntro() {
                setState('playing');
                completeTimer = setTimeout(completeIntro, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 450 : 3500);
            }

            function goNext() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'NYANG_AI_INTRO_COMPLETE' }, '*');
                    return;
                }

                window.location.href = continueTarget;
            }

            function handleSpace(event) {
                if (event.code !== 'Space' || !canHandleSpace(event)) return;
                event.preventDefault();

                if (state === 'idle') {
                    playIntro();
                } else if (state === 'playing') {
                    completeIntro();
                } else if (state === 'completed') {
                    goNext();
                }
            }

            imageEls.forEach((img) => {
                img.addEventListener('error', () => {
                    fallback.classList.add('show');
                }, { once: true });
            });

            window.addEventListener('keydown', handleSpace);

            window.addEventListener('beforeunload', () => {
                window.removeEventListener('keydown', handleSpace);
                if (completeTimer) clearTimeout(completeTimer);
            });
        })();
    </script>
</body>

</html>
